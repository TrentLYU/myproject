<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Molecular Reaction Lab v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;background:#000}
#panel{position:fixed;top:10px;left:10px;z-index:10;color:#e0e0e0;
  background:rgba(12,15,22,.84);padding:12px 16px;border-radius:12px;
  font-size:12px;line-height:1.7;max-width:380px;
  backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08)}
#panel b{color:#8ecbff}
#eqs{color:#ffd54f;font-size:11px;margin:6px 0;line-height:1.65}
#stats{margin:6px 0;padding:8px;background:rgba(255,255,255,.05);
  border-radius:8px;font-family:"Cascadia Code",monospace;font-size:11px;white-space:pre-line}
#legend{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:6px;font-size:11px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
#arrBox{margin-top:10px}
#arrCanvas{background:rgba(255,255,255,.04);border-radius:8px;display:block;margin-top:4px}
</style>
</head>
<body>
<div id="panel">
  <b>🧪 分子反应实验台 v2</b><br>
  <span style="color:#aaa">双击画面移动热源 ｜ 右侧面板调参</span>
  <div id="eqs">
    ① 2Na + 2H₂O → 2Na⁺ + 2OH⁻ + H₂↑<br>
    ② H⁺ + OH⁻ → H₂O（中和）<br>
    ③ Ag⁺ + Cl⁻ → AgCl↓（沉淀）<br>
    ④ Resin + Na⁺ → Resin-Na + H⁺（离子交换）
  </div>
  <div id="stats">加载中…</div>
  <div id="legend"></div>
  <div id="arrBox">
    <b>Arrhenius 曲线</b> <span style="color:#aaa">k(T)=A·e^(−Ea/T)</span>
    <canvas id="arrCanvas" width="340" height="130"></canvas>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import*as THREE from'three';
import{OrbitControls}from'three/addons/controls/OrbitControls.js';
import{GUI}from'three/addons/libs/lil-gui.module.min.js';

/* ===== 1 物种 ===== */
const SKEYS=['Na','H2O','HP','OH','NaP','Cl','AgP','AgCl','H2'];
const SPECIES={
  Na:{label:'Na 原子',color:0xb0bec5,r:.075,m:1},
  H2O:{label:'H₂O',color:0x2f6fdb,r:.050,m:1},
  HP:{label:'H⁺',color:0xffee58,r:.038,m:.6},
  OH:{label:'OH⁻',color:0xff5252,r:.050,m:1},
  NaP:{label:'Na⁺',color:0xff9800,r:.055,m:1},
  Cl:{label:'Cl⁻',color:0x66bb6a,r:.062,m:1},
  AgP:{label:'Ag⁺',color:0xba68c8,r:.055,m:1.5},
  AgCl:{label:'AgCl↓',color:0xe0e0e0,r:.085,m:3},
  H2:{label:'H₂↑',color:0xffffff,r:.045,m:.3}
};
const KEY={};SKEYS.forEach((k,i)=>KEY[k]=i);
document.getElementById('legend').innerHTML=SKEYS.map(k=>{
  const s=SPECIES[k];
  return`<span><span class="dot" style="background:#${s.color.toString(16).padStart(6,'0')}"></span>${s.label}</span>`;
}).join('');

/* ===== 2 反应表 ===== */
const REACTIONS=[
  {name:'Na+H₂O',a:'Na',b:'H2O',prod:['NaP','OH'],gas:{k:'H2',p:.5},Ea:3,A:.9,exo:1.4,on:true},
  {name:'H⁺+OH⁻',a:'HP',b:'OH',prod:['H2O'],gas:null,Ea:.15,A:1,exo:.8,on:true},
  {name:'Ag⁺+Cl⁻',a:'AgP',b:'Cl',prod:['AgCl'],gas:null,Ea:.15,A:1,exo:.4,on:true}
];
const pairMap={};
REACTIONS.forEach(r=>{pairMap[r.a+'|'+r.b]=r;pairMap[r.b+'|'+r.a]=r;});
let selRx=0;

/* ===== 3 场景 ===== */
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0d1017);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
camera.position.set(3.2,2.8,4.6);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(0,1,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x334455,1));
const dl=new THREE.DirectionalLight(0xffffff,1.3);dl.position.set(5,8,4);scene.add(dl);
scene.add(new THREE.GridHelper(10,20,0x334455,0x1e2633));

/* ===== 4 参数 ===== */
const params={shape:'beaker',size:1,heatPower:3.5,heatSigma:.6,T0:1,
  buoyancy:.5,gravity:.5,followMouse:false};

/* ===== 5 容器 ===== */
let containerMesh=null,D={};
const wallMat=new THREE.MeshPhysicalMaterial({color:0xaed6ff,transparent:true,
  opacity:.13,roughness:.05,side:THREE.DoubleSide,depthWrite:false});

function buildContainer(){
  if(containerMesh){containerMesh.traverse(m=>m.geometry?.dispose());scene.remove(containerMesh);}
  const S=params.size;containerMesh=new THREE.Group();
  const lathe=pts=>new THREE.Mesh(new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),64),wallMat);
  if(params.shape==='beaker'){
    const R=1.1*S,H=2.2*S;D={R,H};
    const m=new THREE.Mesh(new THREE.CylinderGeometry(R,R,H,64,1,false),wallMat);
    m.position.y=H/2;containerMesh.add(m);
  }else if(params.shape==='erlenmeyer'){
    const Rb=1.3*S,Rn=.32*S,Hc=1.6*S,Hn=.9*S;D={Rb,Rn,Hc,Hn};
    containerMesh.add(lathe([[0,0],[Rb,0],[Rn,Hc],[Rn,Hc+Hn],[Rn+.05,Hc+Hn]]));
  }else{
    const R=1.1*S,Rn=.3*S,phiN=Math.asin(Rn/R),phiMax=Math.PI-phiN;
    const y0=R*(1-Math.cos(phiMax)),Hn=.9*S;D={R,Rn,y0,Hn};
    const pts=[];
    for(let i=0;i<=24;i++){const ph=phiMax*i/24;pts.push([R*Math.sin(ph),R*(1-Math.cos(ph))]);}
    pts.push([Rn,y0+Hn],[Rn+.05,y0+Hn]);
    containerMesh.add(lathe(pts));
  }
  scene.add(containerMesh);
}
function isInside(x,y,z,m){
  const s=params.shape;
  if(s==='beaker')return x*x+z*z<(D.R-m)**2&&y>m&&y<D.H-m;
  if(s==='erlenmeyer'){
    if(y>D.Hc)return x*x+z*z<(D.Rn-m)**2&&y<D.Hc+D.Hn-m;
    return x*x+z*z<(THREE.MathUtils.lerp(D.Rb,D.Rn,y/D.Hc)-m)**2&&y>m;
  }
  if(y>D.y0)return x*x+z*z<(D.Rn-m)**2&&y<D.y0+D.Hn-m;
  return x*x+(y-D.R)**2+z*z<(D.R-m)**2;
}
function topY(){
  if(params.shape==='beaker')return D.H;
  if(params.shape==='erlenmeyer')return D.Hc+D.Hn;
  return D.y0+D.Hn;
}
const REST=.8;
function reflect(i,nx,ny,nz){
  const vn=vx[i]*nx+vy[i]*ny+vz[i]*nz;
  if(vn>0){vx[i]-=(1+REST)*vn*nx;vy[i]-=(1+REST)*vn*ny;vz[i]-=(1+REST)*vn*nz;}
}
function constrain(i,r){
  const s=params.shape;
  if(py[i]<r){py[i]=r;if(vy[i]<0)vy[i]*=-REST;}
  if(s==='beaker'){
    const rad=Math.hypot(px[i],pz[i]),lim=D.R-r;
    if(rad>lim&&rad>1e-6){
      const nx=px[i]/rad,nz=pz[i]/rad;
      px[i]=nx*lim;pz[i]=nz*lim;reflect(i,nx,0,nz);
    }
    if(py[i]>D.H-r){py[i]=D.H-r;reflect(i,0,-1,0);}
  }else if(s==='erlenmeyer'){
    if(py[i]>D.Hc){
      const rad=Math.hypot(px[i],pz[i]),lim=D.Rn-r;
      if(rad>lim&&rad>1e-6){px[i]=px[i]/rad*lim;pz[i]=pz[i]/rad*lim;reflect(i,px[i]/rad,0,pz[i]/rad);}
      if(py[i]>D.Hc+D.Hn-r){py[i]=D.Hc+D.Hn-r;reflect(i,0,-1,0);}
    }else{
      const rad=Math.hypot(px[i],pz[i]);
      const localR=THREE.MathUtils.lerp(D.Rb,D.Rn,py[i]/D.Hc);
      const lim=localR-r;
      if(rad>lim&&rad>1e-6){
        const slope=(D.Rb-D.Rn)/D.Hc;
        let gx=px[i]/rad,gy=slope,gz=pz[i]/rad;
        const gl=Math.hypot(gx,gy,gz);gx/=gl;gy/=gl;gz/=gl;
        px[i]-=gx*(rad-lim);pz[i]-=gz*(rad-lim);reflect(i,gx,gy,gz);
      }
    }
  }else{
    if(py[i]>D.y0){
      const rad=Math.hypot(px[i],pz[i]),lim=D.Rn-r;
      if(rad>lim&&rad>1e-6){px[i]=px[i]/rad*lim;pz[i]=pz[i]/rad*lim;reflect(i,px[i]/rad,0,pz[i]/rad);}
      if(py[i]>D.y0+D.Hn-r){py[i]=D.y0+D.Hn-r;reflect(i,0,-1,0);}
    }else{
      const dy=py[i]-D.R,d=Math.hypot(px[i],dy,pz[i]),lim=D.R-r;
      if(d>lim&&d>1e-6){
        const nx=px[i]/d,ny=dy/d,nz=pz[i]/d;
        px[i]=nx*lim;py[i]=D.R+ny*lim;pz[i]=nz*lim;reflect(i,nx,ny,nz);
      }
    }
  }
}

/* ===== 6 树脂球 ===== */
const resin={on:true,x:0,y:.55,z:0,R:.55,poreSize:.058,capacity:120,filled:0};
const resinMesh=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),
  new THREE.MeshPhysicalMaterial({color:0xd7a86e,transparent:true,opacity:.3,roughness:.4,depthWrite:false}));
resinMesh.renderOrder=2;scene.add(resinMesh);
const resinBase=new THREE.Color(0xd7a86e),resinLoaded=new THREE.Color(0xbf360c);
let siteMesh=null;
const exchange={Ea:1.2,A:.5,exo:.3};
function buildSites(){
  if(siteMesh){siteMesh.geometry.dispose();siteMesh.material.dispose();scene.remove(siteMesh);}
  const cap=resin.capacity;
  siteMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(.022,8,6),
    new THREE.MeshStandardMaterial({roughness:.5}),cap);
  const dm=new THREE.Object3D(),c=new THREE.Color();
  for(let i=0;i<cap;i++){
    let x,y,z;do{x=Math.random()*2-1;y=Math.random()*2-1;z=Math.random()*2-1;}while(x*x+y*y+z*z>.77);
    dm.position.set(resin.x+x*resin.R,resin.y+y*resin.R,resin.z+z*resin.R);
    dm.updateMatrix();siteMesh.setMatrixAt(i,dm.matrix);
    c.setHex(0x8d6e63);siteMesh.setColorAt(i,c);
  }
  scene.add(siteMesh);
}
function markSite(idx){
  if(siteMesh&&idx<resin.capacity){
    siteMesh.setColorAt(idx,new THREE.Color(0xff9800));
    siteMesh.instanceColor.needsUpdate=true;
  }
}
function updateResinVisual(){
  resinMesh.visible=siteMesh.visible=resin.on;
  if(!resin.on)return;
  resinMesh.scale.setScalar(resin.R);
  resinMesh.position.set(resin.x,resin.y,resin.z);
  resinMesh.material.color.lerpColors(resinBase,resinLoaded,resin.filled/resin.capacity);
}

/* ===== 7 热源 & 温度场 ===== */
const heater=new THREE.Vector3(.5,.1,0);
const heatBall=new THREE.Mesh(new THREE.SphereGeometry(.09,16,12),
  new THREE.MeshBasicMaterial({color:0xff5522}));
const heatHalo=new THREE.Mesh(new THREE.SphereGeometry(1,24,18),
  new THREE.MeshBasicMaterial({color:0xff7733,transparent:true,opacity:.1,depthWrite:false}));
const heatLight=new THREE.PointLight(0xff6622,20,6);
scene.add(heatBall,heatHalo,heatLight);
const pulses=[];
function addPulse(x,y,z,A){if(pulses.length>80)pulses.shift();pulses.push({x,y,z,A,s:.25});}
function updatePulses(dt){
  for(let k=pulses.length-1;k>=0;k--){
    const p=pulses[k];p.s=Math.min(p.s+.5*dt,.9);p.A*=Math.exp(-dt/1.4);
    if(p.A<.02)pulses.splice(k,1);
  }
}
function temperature(x,y,z){
  let T=params.T0;
  const hx=x-heater.x,hy=y-heater.y,hz=z-heater.z;
  T+=params.heatPower*Math.exp(-(hx*hx+hy*hy+hz*hz)/(2*params.heatSigma**2));
  for(let k=0;k<pulses.length;k++){
    const p=pulses[k],dx=x-p.x,dy=y-p.y,dz=z-p.z;
    T+=p.A*Math.exp(-(dx*dx+dy*dy+dz*dz)/(2*p.s*p.s));
  }
  return T;
}
const raycaster=new THREE.Raycaster(),ndc=new THREE.Vector2(),
  groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function moveHeater(e){
  ndc.x=e.clientX/innerWidth*2-1;ndc.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(ndc,camera);
  const hit=new THREE.Vector3();
  if(raycaster.ray.intersectPlane(groundPlane,hit)){
    if(hit.length()>3)hit.setLength(3);heater.copy(hit);
  }
}
renderer.domElement.addEventListener('dblclick',moveHeater);
renderer.domElement.addEventListener('pointermove',e=>{if(params.followMouse)moveHeater(e);});

/* ===== 8 粒子系统 ===== */
const MAXN=1600;
const px=new Float32Array(MAXN),py=new Float32Array(MAXN),pz=new Float32Array(MAXN),
      vx=new Float32Array(MAXN),vy=new Float32Array(MAXN),vz=new Float32Array(MAXN),
      Tarr=new Float32Array(MAXN);
const id=new Uint8Array(MAXN),alive=new Uint8Array(MAXN);
let count=0;
const molMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(1,10,8),
  new THREE.MeshStandardMaterial({roughness:.35}),MAXN);
scene.add(molMesh);
const dummy=new THREE.Object3D(),col=new THREE.Color(),hotCol=new THREE.Color(0xff3300);
function spawn(k,x,y,z){
  if(count>=MAXN)return -1;
  const i=count++;
  id[i]=KEY[k];alive[i]=1;px[i]=x;py[i]=y;pz[i]=z;
  vx[i]=(Math.random()-.5)*.6;vy[i]=(Math.random()-.5)*.6;vz[i]=(Math.random()-.5)*.6;
  Tarr[i]=params.T0;return i;
}
function inResin(x,y,z,r){
  if(!resin.on)return false;
  const dx=x-resin.x,dy=y-resin.y,dz=z-resin.z;
  return dx*dx+dy*dy+dz*dz<(resin.R+r+.02)**2;
}
function addSpecies(kind,n){
  const rr=SPECIES[kind].r;
  for(let k=0;k<n;k++){
    for(let t=0;t<100;t++){
      const x=(Math.random()*2-1)*1.5*params.size,
            y=Math.random()*2.5*params.size,
            z=(Math.random()*2-1)*1.5*params.size;
      if(isInside(x,y,z,rr)&&!inResin(x,y,z,rr)){spawn(kind,x,y,z);break;}
    }
  }
}

/* ===== 9 空间网格 ===== */
const CELL=.4,gridMap=new Map();
function cellKey(cx,cy,cz){return(cx+500)*1e6+(cy+500)*1e3+(cz+500);}
function rebuildGrid(){
  gridMap.clear();
  for(let i=0;i<count;i++){
    if(!alive[i])continue;
    const k=cellKey(Math.floor(px[i]/CELL),Math.floor(py[i]/CELL),Math.floor(pz[i]/CELL));
    let a=gridMap.get(k);if(!a){a=[];gridMap.set(k,a);}a.push(i);
  }
}
const nb=[];
function getNeighbors(i){
  nb.length=0;
  const cx=Math.floor(px[i]/CELL),cy=Math.floor(py[i]/CELL),cz=Math.floor(pz[i]/CELL);
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){
    const a=gridMap.get(cellKey(cx+dx,cy+dy,cz+dz));
    if(a)for(let k=0;k<a.length;k++)if(a[k]!==i)nb.push(a[k]);
  }
}

/* ===== 10 反应 ===== */
const stats={rxn:0,exchanged:0,h2out:0};
function tryReact(i,j){
  const ki=SKEYS[id[i]],kj=SKEYS[id[j]];
  const r=pairMap[ki+'|'+kj];
  if(!r||!r.on)return false;
  const T=temperature(px[i],py[i],pz[i]);
  if(Math.random()>r.A*Math.exp(-r.Ea/T))return false;
  stats.rxn++;
  const mx=(px[i]+px[j])*.5,my=(py[i]+py[j])*.5,mz=(pz[i]+pz[j])*.5;
  alive[i]=0;alive[j]=0;
  for(const p of r.prod)if(isInside(mx,my,mz,SPECIES[p].r))
    spawn(p,mx+(Math.random()-.5)*.06,my+(Math.random()-.5)*.06,mz+(Math.random()-.5)*.06);
  if(r.gas&&Math.random()<r.gas.p&&isInside(mx,my+.1,mz,SPECIES[r.gas.k].r))
    spawn(r.gas.k,mx,my+.1,mz);
  if(r.exo>0)addPulse(mx,my,mz,r.exo);
  return true;
}

/* ===== 11 物理 ===== */
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function step(dt){
  rebuildGrid();
  for(let i=0;i<count;i++){
    if(!alive[i])continue;
    getNeighbors(i);
    const ri=SPECIES[SKEYS[id[i]]].r;
    for(let k=0;k<nb.length;k++){
      const j=nb[k];
      if(j<=i||!alive[i]||!alive[j])continue;
      const rj=SPECIES[SKEYS[id[j]]].r;
      const dx=px[i]-px[j],dy=py[i]-py[j],dz=pz[i]-pz[j];
      const d2=dx*dx+dy*dy+dz*dz,rr=ri+rj;
      if(d2<rr*rr&&d2>1e-10){
        const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,nz=dz/d;
        const vn=(vx[i]-vx[j])*nx+(vy[i]-vy[j])*ny+(vz[i]-vz[j])*nz;
        if(vn<0){
          const mi=SPECIES[SKEYS[id[i]]].m,mj=SPECIES[SKEYS[id[j]]].m;
          const imp=vn*(1+REST)/(1/mi+1/mj);
          vx[i]-=imp/mi*nx;vy[i]-=imp/mi*ny;vz[i]-=imp/mi*nz;
          vx[j]+=imp/mj*nx;vy[j]+=imp/mj*ny;vz[j]+=imp/mj*nz;
        }
        const ov=(rr-d)*.5;
        px[i]+=nx*ov;py[i]+=ny*ov;pz[i]+=nz*ov;
        px[j]-=nx*ov;py[j]-=ny*ov;pz[j]-=nz*ov;
        tryReact(i,j);
      }
    }
  }
  if(resin.on){
    for(let i=0;i<count;i++){
      if(!alive[i])continue;
      const ki=SKEYS[id[i]];
      const dx=px[i]-resin.x,dy=py[i]-resin.y,dz=pz[i]-resin.z;
      const d2=dx*dx+dy*dy+dz*dz,ri=SPECIES[ki].r;
      if(d2<(resin.R+ri)**2){
        if(ki==='NaP'&&ri<resin.poreSize+.02&&resin.filled<resin.capacity){
          const T=temperature(px[i],py[i],pz[i]);
          if(Math.random()<exchange.A*Math.exp(-exchange.Ea/T)*dt*3){
            alive[i]=0;spawn('HP',px[i],py[i],pz[i]);
            resin.filled++;stats.exchanged++;markSite(resin.filled-1);
            addPulse(px[i],py[i],pz[i],exchange.exo);
          }
        }else if(ki!=='HP'&&ki!=='NaP'){
          const d=Math.sqrt(d2)||.001,nx=dx/d,ny=dy/d,nz=dz/d;
          px[i]=resin.x+nx*(resin.R+ri);py[i]=resin.y+ny*(resin.R+ri);pz[i]=resin.z+nz*(resin.R+ri);
          reflect(i,-nx,-ny,-nz);
        }
      }
    }
  }
  for(let i=0;i<count;i++){
    if(!alive[i])continue;
    const ki=SKEYS[id[i]],sp=SPECIES[ki];
    const T=temperature(px[i],py[i],pz[i]);Tarr[i]=T;
    const kick=1.5*Math.sqrt(T)*Math.sqrt(dt);
    vx[i]+=gauss()*kick;vy[i]+=gauss()*kick;vz[i]+=gauss()*kick;
    const target=Math.sqrt(T)*1.1/Math.sqrt(sp.m);
    const spd=Math.hypot(vx[i],vy[i],vz[i])||1e-6;
    const f=1+(target/spd-1)*.1;
    vx[i]*=f;vy[i]*=f;vz[i]*=f;
    if(ki==='H2'){
      vy[i]+=2*dt;
      if(py[i]>topY()-.05){alive[i]=0;stats.h2out++;continue;}
    }else{
      vy[i]+=params.buoyancy*(T-params.T0)*dt*.5;
      vy[i]-=params.gravity*sp.m*dt*.3;
    }
    vx[i]*=.995;vy[i]*=.995;vz[i]*=.995;
    px[i]+=vx[i]*dt;py[i]+=vy[i]*dt;pz[i]+=vz[i]*dt;
    constrain(i,sp.r);
  }
  updatePulses(dt);updateResinVisual();
  let w=0;
  for(let i=0;i<count;i++){
    if(!alive[i])continue;
    if(w!==i){px[w]=px[i];py[w]=py[i];pz[w]=pz[i];
      vx[w]=vx[i];vy[w]=vy[i];vz[w]=vz[i];
      Tarr[w]=Tarr[i];id[w]=id[i];alive[w]=1;}
    w++;
  }
  count=w;
}

/* ===== 12 渲染 ===== */
function updateMesh(){
  let n=0;
  for(let i=0;i<count;i++){
    if(!alive[i])continue;
    const sp=SPECIES[SKEYS[id[i]]];
    dummy.position.set(px[i],py[i],pz[i]);
    dummy.scale.setScalar(sp.r);dummy.updateMatrix();
    molMesh.setMatrixAt(n,dummy.matrix);
    col.setHex(sp.color);
    const T=Tarr[i];
    if(T>params.T0+.5)col.lerp(hotCol,Math.min((T-params.T0-.5)/3,.7));
    molMesh.setColorAt(n,col);n++;
  }
  molMesh.count=n;
  molMesh.instanceMatrix.needsUpdate=true;
  if(molMesh.instanceColor)molMesh.instanceColor.needsUpdate=true;
}

/* ===== 13 Arrhenius 曲线 ===== */
const arrCv=document.getElementById('arrCanvas'),arrCtx=arrCv.getContext('2d');
function drawArr(){
  const w=arrCv.width,h=arrCv.height;
  arrCtx.clearRect(0,0,w,h);
  arrCtx.fillStyle='rgba(255,255,255,.04)';arrCtx.fillRect(0,0,w,h);
  const r=REACTIONS[selRx],Tmin=.3,Tmax=6,kMax=r.A;
  arrCtx.strokeStyle='#555';arrCtx.beginPath();
  arrCtx.moveTo(30,10);arrCtx.lineTo(30,h-20);arrCtx.lineTo(w-10,h-20);arrCtx.stroke();
  arrCtx.fillStyle='#aaa';arrCtx.font='10px monospace';
  arrCtx.fillText('k',4,18);arrCtx.fillText('T →',w-35,h-6);
  arrCtx.strokeStyle='#4fc3f7';arrCtx.lineWidth=2;arrCtx.beginPath();
  for(let i=0;i<w-40;i++){
    const T=Tmin+(Tmax-Tmin)*i/(w-40);
    const k=r.A*Math.exp(-r.Ea/T);
    const y=h-20-(k/kMax)*(h-30);
    i===0?arrCtx.moveTo(30+i,y):arrCtx.lineTo(30+i,y);
  }
  arrCtx.stroke();
  const Tnow=temperature(heater.x,heater.y,heater.z);
  const kNow=r.A*Math.exp(-r.Ea/Tnow);
  const cx=30+(Tnow-Tmin)/(Tmax-Tmin)*(w-40);
  const cy=h-20-(kNow/kMax)*(h-30);
  arrCtx.fillStyle='#ff5252';arrCtx.beginPath();arrCtx.arc(cx,cy,4,0,Math.PI*2);arrCtx.fill();
  arrCtx.fillStyle='#fff';arrCtx.font='10px sans-serif';
  arrCtx.fillText(`T=${Tnow.toFixed(2)}  k=${kNow.toFixed(3)}`,36,16);
  arrCtx.fillText(r.name,36,h-6);
}

/* ===== 14 统计 ===== */
const statsEl=document.getElementById('stats');
function updateStats(){
  const byKind={};
  for(let i=0;i<count;i++){if(!alive[i])continue;const k=SKEYS[id[i]];byKind[k]=(byKind[k]||0)+1;}
  let s=`粒子:${count}  反应:${stats.rxn}  交换:${stats.exchanged}  H₂逸出:${stats.h2out}\n`;
  for(const k of SKEYS)if(byKind[k])s+=`${SPECIES[k].label}:${byKind[k]}  `;
  statsEl.textContent=s;
}

/* ===== 16 初始化 ===== */
function resetAll(){
  count=0;stats.rxn=0;stats.exchanged=0;stats.h2out=0;
  resin.filled=0;buildSites();
  addSpecies('H2O',200);addSpecies('Na',15);
}
buildContainer();resetAll();

/* ===== 17 主循环 ===== */
const clock=new THREE.Clock();let frame=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.033);
  step(dt);updateMesh();
  heatBall.position.copy(heater);heatHalo.position.copy(heater);
  heatHalo.scale.setScalar(params.heatSigma*1.6);
  heatHalo.visible=heatBall.visible=params.heatPower>.05;
  heatLight.position.copy(heater);heatLight.position.y+=.25;
  heatLight.intensity=params.heatPower*6;
  if(frame++%10===0){drawArr();updateStats();}
  controls.update();renderer.render(scene,camera);
}
animate();

/* ===== 18 窗口 ===== */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
